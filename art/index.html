<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Art - Meelod</title>
  <meta name="description" content="Art and images by Meelod.">
  <link rel="canonical" href="https://meelodwaheed.com/art">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Art — Meelod">
  <meta property="og:description" content="Art and images by Meelod.">
  <meta property="og:url" content="https://meelodwaheed.com/art">
  <meta property="og:image" content="https://meelodwaheed.com/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Art — Meelod">
  <meta name="twitter:description" content="Art and images by Meelod.">
  <meta name="twitter:image" content="https://meelodwaheed.com/og.png">

  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <a class="name" href="/">Meelod</a>
      <nav aria-label="Primary">
        <a class="active" href="/art/">Art</a>
        <a href="/books/">Books</a>
        <a href="/movies/">Film</a>
        <a href="/writing/">Writing</a>
      </nav>
    </header>

    <main>
      <p class="intro">A small collection of things I've made.</p>

      <div class="grid" id="art-grid" aria-live="polite">
        <noscript>Enable JavaScript to view the gallery.</noscript>
      </div>
    </main>
  </div>

  <script>
    (async function loadArt() {
      const grid = document.getElementById("art-grid");
      const exts = /\.(jpe?g|png|gif|webp|avif)$/i;
      try {
        const res = await fetch("https://api.github.com/repos/meelod/meelod.github.io/contents/art/images");
        if (!res.ok) throw new Error("API " + res.status);
        const files = await res.json();
        const images = files
          .filter(f => f.type === "file" && exts.test(f.name))
          .sort((a, b) => a.name.localeCompare(b.name));
        grid.replaceChildren();
        if (images.length === 0) {
          const empty = document.createElement("p");
          empty.textContent = "Nothing here yet.";
          empty.style.color = "var(--muted)";
          grid.appendChild(empty);
          return;
        }
        for (const file of images) {
          const img = document.createElement("img");
          img.src = "/art/images/" + encodeURIComponent(file.name);
          img.alt = "";
          img.loading = "lazy";
          grid.appendChild(img);
        }
      } catch (err) {
        grid.replaceChildren();
        const msg = document.createElement("p");
        msg.textContent = "Could not load gallery.";
        msg.style.color = "var(--muted)";
        grid.appendChild(msg);
      }
    })();
  </script>
</body>
</html>
