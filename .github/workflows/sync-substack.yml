name: Sync Substack posts

on:
  schedule:
    - cron: "0 12 * * *"   # daily at 12:00 UTC
  workflow_dispatch:        # run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-substack
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync latest posts into writing page
        run: node scripts/sync-substack.mjs

      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain writing/index.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add writing/index.html
            git commit -m "Sync latest Substack posts"
            git push
          else
            echo "No changes to commit."
          fi
